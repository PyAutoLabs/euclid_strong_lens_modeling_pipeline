# Workspace overrides for the library latent toggles. The PyAutoLens library
# defaults the three raw-flux keys (`total_lens_flux`,
# `total_lensed_source_flux`, `total_source_flux`) to `true`, and the three
# µJy variants plus `magnification` and `effective_einstein_radius` to
# `false`. This file pins all six explicitly, so the emitted catalogue is
# stated here in full rather than half-inherited: a Euclid fit gets the whole
# library latent catalogue plus the four pipeline-specific FWHM aperture-flux
# latents (hardcoded in `util.py::LatentEuclid.APERTURE_LATENT_KEYS`).
#
# All flux-derived µJy latents (everything except the raw-flux keys,
# `magnification` and `effective_einstein_radius`) require `magzero` in the
# AnalysisImaging kwargs — euclid's pipeline already passes it from the FITS
# header.

# Raw-flux latents, in the image units the fit was performed in. These are the
# library defaults (`true`); pinned here so this file states its full output.
total_lens_flux: true
total_lensed_source_flux: true
total_source_flux: true

# µJy variants and the derived latents — library defaults are `false`, enabled
# here because the pipeline supplies `magzero`.
total_lens_flux_mujy: true
total_lensed_source_flux_mujy: true
total_source_flux_mujy: true
magnification: true
effective_einstein_radius: true

# autogalaxy library default (loaded by autonerves into the same `latent`
# conf node) — explicitly disabled to silence the cross-library
# "unknown latent" warning that would otherwise fire on every fit. The
# Euclid pipeline's µJy latents above remain the canonical output.
total_galaxy_0_flux: false
